<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能 SQL 助手</title>
<style>
  :root { --bg: #1a1a2e; --surface: #16213e; --border: #0f3460; --text: #e0e0e0; --muted: #8892b0; --accent: #e94560; --accent2: #0f3460; --user-bg: #0f3460; --bot-bg: #16213e; --sql-bg: #1a1a2e; --success: #4ecca3; --warn: #f0a500; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--surface); padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .badge { font-size: 11px; background: var(--accent2); padding: 2px 8px; border-radius: 10px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 85%; line-height: 1.6; font-size: 14px; }
  .msg.user { align-self: flex-end; background: var(--user-bg); padding: 10px 16px; border-radius: 16px 16px 4px 16px; }
  .msg.bot { align-self: flex-start; width: 100%; max-width: 100%; }
  .msg .content { background: var(--bot-bg); padding: 12px 16px; border-radius: 4px 16px 16px 16px; white-space: pre-wrap; }
  .sql-block { background: var(--sql-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 8px 0; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; overflow-x: auto; }
  .sql-block .label { color: var(--accent); font-size: 11px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .status-block { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .result-block { background: var(--sql-bg); border: 1px solid var(--success); border-radius: 8px; padding: 10px 14px; margin: 8px 0; font-size: 12px; max-height: 200px; overflow-y: auto; }
  .result-block .label { color: var(--success); font-size: 11px; margin-bottom: 4px; }
  .error-block { background: var(--sql-bg); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin: 8px 0; font-size: 12px; color: var(--accent); }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent); animation: blink 1s infinite; vertical-align: text-bottom; }
  @keyframes blink { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
  #input-area { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 10px; align-items: center; }
  #input-area textarea { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; color: var(--text); font-size: 14px; resize: none; outline: none; font-family: inherit; max-height: 120px; }
  #input-area textarea:focus { border-color: var(--accent); }
  #input-area button { background: var(--accent); color: white; border: none; border-radius: 12px; padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; }
  #input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
  #input-area button:hover:not(:disabled) { filter: brightness(1.2); }
  #new-session { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  #new-session:hover { border-color: var(--accent); color: var(--text); }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
  th { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>

<header>
  <h1>🤖 智能 SQL 助手</h1>
  <span class="badge">v2 · 支持读写</span>
  <button id="new-session" onclick="newSession()">+ 新会话</button>
  <span id="session-id" style="font-size:11px;color:var(--muted)"></span>
</header>

<div id="chat">
  <div class="msg bot" id="welcome">
    <div class="content">
👋 你好！我是智能 SQL 助手。

我可以帮你：
• 📊 查询数据——"开发部有哪些人？"
• ✏️ 修改数据——"把张三的工资涨到 3 万"
• ➕ 添加数据——"新增一个叫刘九的员工"
• 🗑️ 删除数据——"删除 id 为 5 的员工"

写操作前我会确认，多轮对话自动记住上下文。</div>
  </div>
</div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="输入自然语言问题或操作..."
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button id="send-btn" onclick="send()">发送</button>
</div>

<script>
let sessionId = '';
let isStreaming = false;

// 创建新会话
async function newSession() {
  if (isStreaming) return;
  const res = await fetch('/api/chat/session', { method: 'POST' });
  const data = await res.json();
  sessionId = data.session_id;
  document.getElementById('session-id').textContent = 'Session: ' + sessionId;

  // 清空聊天区（保留欢迎消息）
  const chat = document.getElementById('chat');
  chat.innerHTML = chat.querySelector('#welcome').outerHTML;
}

// 初始化
newSession();

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || isStreaming || !sessionId) return;

  input.value = '';
  isStreaming = true;
  document.getElementById('send-btn').disabled = true;

  // 添加用户消息
  addMessage('user', text);

  // 添加机器人消息容器
  const botMsg = addMessage('bot', '');
  const contentDiv = botMsg.querySelector('.content');

  // 当前活跃的 SQL block / result block
  let currentSqlBlock = null;
  let currentResultBlock = null;
  let tokenBuffer = '';

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = JSON.parse(line.slice(6));

        switch (payload.type) {
          case 'status':
            // 添加状态提示
            if (contentDiv.lastElementChild?.classList?.contains('status-block')) {
              contentDiv.lastElementChild.textContent = payload.data;
            } else {
              const status = document.createElement('div');
              status.className = 'status-block';
              status.textContent = payload.data;
              contentDiv.appendChild(status);
            }
            break;

          case 'tool_call':
            const tc = JSON.parse(payload.data);
            const sqlBlock = document.createElement('div');
            sqlBlock.className = 'sql-block';
            sqlBlock.innerHTML = `<div class="label">🔧 ${tc.function}</div><code>${escapeHtml(tc.sql)}</code>`;
            contentDiv.appendChild(sqlBlock);
            currentSqlBlock = sqlBlock;
            break;

          case 'query_result':
            const rows = JSON.parse(payload.data);
            const resultBlock = document.createElement('div');
            resultBlock.className = 'result-block';
            if (rows.length > 0) {
              const keys = Object.keys(rows[0]);
              let table = '<table><tr>' + keys.map(k => `<th>${k}</th>`).join('') + '</tr>';
              table += rows.slice(0, 20).map(r => '<tr>' + keys.map(k => `<td>${r[k] !== null ? r[k] : '<i style="color:var(--muted)">null</i>'}</td>`).join('') + '</tr>').join('');
              table += '</table>';
              if (rows.length > 20) table += `<div style="color:var(--muted);font-size:11px;margin-top:4px">... 共 ${rows.length} 条，仅显示前 20 条</div>`;
              resultBlock.innerHTML = `<div class="label">📋 查询结果 (${rows.length} 条)</div>${table}`;
            } else {
              resultBlock.innerHTML = '<div class="label">📋 查询结果</div>无数据';
            }
            contentDiv.appendChild(resultBlock);
            break;

          case 'write_result':
            const wr = JSON.parse(payload.data);
            const wrBlock = document.createElement('div');
            if (wr.error) {
              wrBlock.className = 'error-block';
              wrBlock.textContent = '❌ ' + wr.error;
            } else {
              wrBlock.className = 'result-block';
              wrBlock.innerHTML = `<div class="label">✅ ${wr.message}</div>`;
            }
            contentDiv.appendChild(wrBlock);
            break;

          case 'error':
            const err = JSON.parse(payload.data);
            const errBlock = document.createElement('div');
            errBlock.className = 'error-block';
            errBlock.textContent = '❌ ' + (err.error || err.message || err);
            contentDiv.appendChild(errBlock);
            break;

          case 'token':
            tokenBuffer += payload.data;
            // 移除旧的 cursor，追加新内容
            const oldCursor = contentDiv.querySelector('.cursor');
            if (oldCursor) oldCursor.remove();

            if (!contentDiv.lastChild || contentDiv.lastChild.nodeType !== Node.TEXT_NODE) {
              contentDiv.appendChild(document.createTextNode(tokenBuffer));
            } else {
              contentDiv.lastChild.textContent = tokenBuffer;
            }
            // 加闪烁光标
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            contentDiv.appendChild(cursor);
            chat.scrollTop = chat.scrollHeight;
            break;

          case 'done':
            const cursor2 = contentDiv.querySelector('.cursor');
            if (cursor2) cursor2.remove();
            break;
        }
      }
    }
  } catch (e) {
    const errBlock = document.createElement('div');
    errBlock.className = 'error-block';
    errBlock.textContent = '❌ 连接中断: ' + e.message;
    contentDiv.appendChild(errBlock);
  } finally {
    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('input').focus();
    const cursor3 = contentDiv.querySelector('.cursor');
    if (cursor3) cursor3.remove();
  }
}

function addMessage(role, text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (role === 'user') {
    div.textContent = text;
  } else {
    div.innerHTML = '<div class="content"></div>';
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
